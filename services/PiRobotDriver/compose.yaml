services:
  dev-driver:
    build:
      context: ../..
      dockerfile: services/PiRobotDriver/Dockerfile
    # network host: discovery DDS con el contenedor del agente ROS (ROS_DOMAIN_ID=42).
    # Los ENV de DDS (ROS_DOMAIN_ID, FASTDDS_BUILTIN_TRANSPORTS) van horneados.
    network_mode: host
    restart: unless-stopped
    # ver .env.example
    env_file: .env

  driver:
    image: localhost/labs-remoto/pi-robot-driver:latest
    restart: unless-stopped
    privileged: true
    cgroup: host            # equivale a --cgroupns=host
    network_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
    devices:
      - /dev/webcam_logitech:/dev/webcam_logitech

  driver-dummy:
    image: localhost/labs-remoto/pi-robot-driver:latest
    restart: unless-stopped
    privileged: true
    cgroup: host            # equivale a --cgroupns=host
    network_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
    devices:
      - /dev/webcam_logitech:/dev/webcam_logitech
    command: ["/app/start.sh", "--camera", "--robot_type", "dummy"]
