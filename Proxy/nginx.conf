# =============================================================================
# nginx — Proxy principal de Labs Remoto
# Instalado directamente en el host (no en Docker)
# =============================================================================
#
# Este archivo configura nginx como punto de entrada único al sistema.
# Todos los servicios backend corren en Docker y publican puertos solo
# en 127.0.0.1 — nginx es el único componente expuesto a la red.
#
# Funciones:
#   1. Servir la SPA (Vue 3)
#   2. Reverse proxy a la API (FastAPI)
#   3. Reverse proxy WebSocket usuario↔API
#   4. Reverse proxy WebSocket Pi↔RosBridge (solo intranet)
#   5. TLS termination (Let's Encrypt / certbot)
#
# Instalación:
#   sudo cp nginx.conf /etc/nginx/sites-available/labs-remoto
#   sudo ln -s /etc/nginx/sites-available/labs-remoto /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (primera vez):
#   sudo certbot --nginx -d <DOMINIO>
#
# =============================================================================

# --- Upstreams ---------------------------------------------------------------
# Los servicios Docker publican puertos solo en 127.0.0.1 (ver compose.yaml)

upstream api {
    server 127.0.0.1:8000;
}

upstream rosbridge {
    server 127.0.0.1:9090;
}

# --- HTTP → HTTPS redirect ---------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;    # TODO: reemplazar con el dominio real

    return 301 https://$host$request_uri;
}

# --- HTTPS (servidor principal) -----------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;    # TODO: reemplazar con el dominio real

    # --- TLS (certbot las configura automáticamente) -------------------------
    # ssl_certificate     /etc/letsencrypt/live/<DOMINIO>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<DOMINIO>/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Headers de seguridad ------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SPA (Vue 3) ---------------------------------------------------------
    # Archivos estáticos generados por `npm run build` en WebClient/
    # Copiar dist/ a /var/www/labs-remoto/ (ver Makefile: make deploy_spa)

    root /var/www/labs-remoto;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API: rutas REST ------------------------------------------------------
    # El frontend usa prefijo /api/ que se reescribe al proxear
    # Ejemplo: GET /api/auth/me → GET http://127.0.0.1:8000/auth/me

    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API: WebSocket usuario↔robot -----------------------------------------
    # El frontend conecta a /ws/user/robot/send_command

    location /ws/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- M2M: registro y handshake de robots ----------------------------------
    # Solo accesible desde la intranet (rangos de IP privados)

    location /m2m/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://api/m2m/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- RosBridge: WebSocket para las Pis ------------------------------------
    # Las RaspberryPi se conectan a wss://<dominio>/rosbridge/
    # nginx proxea al contenedor RosBridge (127.0.0.1:9090)
    # Solo accesible desde la intranet

    location /rosbridge/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://rosbridge/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
