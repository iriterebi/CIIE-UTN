[project]
name = "ciie-remote-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "services/Api",
    "services/RaspberryPi",
]
exclude = []

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "basedpyright>=1.39.0",
    "mypy>=1.18.2",
    "pylint>=3.3.9",
]


[tool.pyright]
include = ["services/Api", "services/RaspberryPi"]
exclude = [
    "**/__pycache__",
]

reportExplicitAny = false
