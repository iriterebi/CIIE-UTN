# =============================================================================
# nginx — Proxy principal de Labs Remoto (containerizado)
# =============================================================================
#
# Versión containerizada del proxy. Todos los servicios se resuelven por
# hostname dentro de la red de Podman (labs-remoto).
#
# Diferencias con nginx.conf (host):
#   - Sin TLS (se agregará después)
#   - Upstreams apuntan a hostnames de contenedores, no a 127.0.0.1
#   - SPA servida via proxy al contenedor webclient (no archivos estáticos)
#
# =============================================================================

# --- Upstreams ---------------------------------------------------------------

upstream api {
    server api:8000;
}

upstream rosbridge {
    server rosbridge:9090;
}

upstream webclient {
    server webclient:80;
}

# --- Servidor principal (HTTP) -----------------------------------------------

server {
    listen 80;
    server_name _;

    # --- Headers de seguridad ------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SPA (Vue 3) — proxeada al contenedor webclient ----------------------

    location / {
        proxy_pass http://webclient;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API: rutas REST ------------------------------------------------------
    # El frontend usa prefijo /api/ que se reescribe al proxear
    # Ejemplo: GET /api/auth/me → GET http://api:8000/auth/me

    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API: WebSocket usuario↔robot -----------------------------------------
    # El frontend conecta a /ws/user/robot/send_command

    location /ws/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- M2M: registro y handshake de robots ----------------------------------
    # Solo accesible desde la intranet (rangos de IP privados)

    location /m2m/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://api/m2m/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- RosBridge: WebSocket para las Pis ------------------------------------
    # Las RaspberryPi se conectan a ws://<dominio>/rosbridge/
    # Solo accesible desde la intranet

    location /rosbridge/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://rosbridge/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
