[project]
name = "ciie-remote-lab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "services/Api",
    "services/PiSystemAgent",
    "services/PiRobotDriver"
]
exclude = []

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "basedpyright>=1.39.0",
    "mypy>=1.18.2",
    "pylint>=3.3.9",
]


[tool.pyright]
include = [
    "services/Api",
    "services/PiSystemAgent",
    "services/PiRobotDriver"
]
exclude = [
    "**/__pycache__",
]
extraPaths = [".ros-typings"]

reportExplicitAny = false
