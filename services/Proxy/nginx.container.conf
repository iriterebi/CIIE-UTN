# =============================================================================
# nginx — Proxy principal de Labs Remoto (containerizado)
# =============================================================================
#
# Versión containerizada del proxy. Todos los servicios se resuelven por
# hostname dentro de la red de Podman (labs-remoto).
#
# Diferencias con nginx.conf (host):
#   - Sin TLS (se agregará después)
#   - Upstreams resueltos vía DNS interno de podman (no 127.0.0.1)
#   - SPA servida via proxy al contenedor webclient (no archivos estáticos)
#
# Resolución DNS dinámica:
#   Los hostnames de los servicios (api, webclient) se resuelven en cada
#   request usando el `resolver` declarado abajo + variables en `proxy_pass`.
#   Esto evita el caché permanente que nginx hace cuando un hostname aparece
#   directo en un `upstream` o en `proxy_pass` — si api/webclient se
#   reinician y obtienen IP nueva, el proxy lo nota en ≤10s en vez de
#   responder 502 hasta que se reinicie nginx.
#
# =============================================================================

# --- Servidor principal (HTTP) -----------------------------------------------

server {
    listen 80;
    server_name _;

    # --- DNS interno de podman -----------------------------------------------
    # aardvark-dns en la red labs-remoto (verificado con
    # `podman exec proxy nslookup api`). Si la red podman cambia, actualizar.

    resolver 10.89.0.1 valid=10s ipv6=off;

    # --- Headers de seguridad ------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SPA (Vue 3) — proxeada al contenedor webclient ----------------------

    location / {
        set $webclient_upstream http://webclient:80;
        proxy_pass $webclient_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API: rutas REST ------------------------------------------------------
    # El frontend usa prefijo /api/ que se reescribe al proxear
    # Ejemplo: GET /api/auth/me → GET http://api:8000/auth/me

    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API: WebSocket usuario↔robot -----------------------------------------
    # El frontend conecta a /ws/user/robot/send_command

    location /ws/ {
        set $api_upstream http://api:8000;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- M2M: registro, handshake y WS de robots ------------------------------
    # HTTP: POST /m2m/robot/register, /m2m/robot/handshake
    # WS:   /m2m/robot/connect (la Pi se conecta directo a la API)
    # Solo accesible desde la intranet (rangos de IP privados)

    location /m2m/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
